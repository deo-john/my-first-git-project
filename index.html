<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Subnet Calculator</title>
  <style>
    :root{--bg:#f7f7f8;--card:#fff;--muted:#666;--accent:#2b7cff}
    html,body{height:100%}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;margin:0;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:40px}
    .wrap{width:760px;max-width:95%}
    h1{margin:0 0 16px;font-size:28px}
    .card{background:var(--card);border-radius:6px;padding:18px 20px;box-shadow:0 1px 0 rgba(0,0,0,0.06);border:1px solid rgba(0,0,0,0.04)}
    label{display:block;margin-bottom:8px;color:var(--muted)}
    input[type="text"]{width:100%;padding:14px 12px;border:1px solid #d9d9db;border-radius:4px;font-size:15px}
    .btn{display:inline-block;margin-top:12px;width:100%;padding:12px;background:#eee;border:1px solid #d0d0d0;border-radius:4px;text-align:center;cursor:pointer;font-weight:600}
    .btn:active{transform:translateY(1px)}
    .result{margin-top:18px;background:#fafafa;padding:14px;border-radius:6px;border:1px solid #eee}
    .row{display:flex;gap:18px;align-items:center}
    .item{margin:6px 0}
    .label{font-weight:700;color:#111;margin-right:6px}
    .muted{color:var(--muted);font-weight:600}
    .error{color:#b40000;margin-top:8px}
    @media (max-width:520px){.row{flex-direction:column;align-items:stretch}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Subnet Calculator</h1>
    <div class="card">
      <label for="ip">IP Address (e.g., 192.168.1.10/24):</label>
      <input id="ip" type="text" placeholder="192.168.0.10/24" value="192.168.0.10/24" />
      <div id="calc" class="btn">Calculate</div>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
      <div id="output" class="result" style="display:none">
        <div class="item"><span class="label">Network:</span> <span id="network"></span></div>
        <div class="item"><span class="label">Broadcast:</span> <span id="broadcast"></span></div>
        <div class="item"><span class="label">First Usable:</span> <span id="first"></span></div>
        <div class="item"><span class="label">Last Usable:</span> <span id="last"></span></div>
        <div class="item"><span class="label">Usable Hosts:</span> <span id="hosts"></span></div>
      </div>
    </div>
  </div>

  <script>
    const elIp = document.getElementById('ip');
    const btn = document.getElementById('calc');
    const out = document.getElementById('output');
    const err = document.getElementById('error');

    function showError(msg){ err.textContent = msg; out.style.display='none'; }
    function clearError(){ err.textContent = ''; }

    function toOctets(n){ return [(n>>>24)&0xFF,(n>>>16)&0xFF,(n>>>8)&0xFF,n&0xFF].join('.'); }

    function parseIP(ipStr){
      const parts = ipStr.split('/');
      if(parts.length!==2) return null;
      const ip = parts[0].trim();
      const prefix = Number(parts[1].trim());
      if(!Number.isInteger(prefix) || prefix<0 || prefix>32) return null;
      const oct = ip.split('.');
      if(oct.length!==4) return null;
      const nums = oct.map(o=>Number(o));
      if(nums.some(n=>!Number.isInteger(n) || n<0 || n>255)) return null;
      const ipInt = ((nums[0]<<24)>>>0) + ((nums[1]<<16)>>>0) + ((nums[2]<<8)>>>0) + (nums[3]>>>0);
      return {ipInt, prefix};
    }

    function makeMask(prefix){
      const oct = [];
      let rem = prefix;
      for(let i=0;i<4;i++){
        if(rem>=8){ oct.push(255); rem-=8; }
        else if(rem<=0){ oct.push(0); }
        else { oct.push((0xFF << (8-rem)) & 0xFF); rem=0; }
      }
      return ( (oct[0]<<24)>>>0 ) + ((oct[1]<<16)>>>0) + ((oct[2]<<8)>>>0) + (oct[3]>>>0);
    }

    function calc(ipWithCidr){
      clearError();
      const parsed = parseIP(ipWithCidr);
      if(!parsed){ showError('Invalid input. Use format: 192.168.0.10/24'); return; }
      const {ipInt,prefix} = parsed;
      const mask = makeMask(prefix);
      const network = (ipInt & mask)>>>0;
      const broadcast = (network | (~mask >>>0))>>>0;

      let first, last, usable;
      if(prefix===32){ first = network; last = network; usable = 1; }
      else if(prefix===31){ first = network; last = broadcast; usable = 2; }
      else { first = (network + 1)>>>0; last = (broadcast - 1)>>>0; usable = Math.max(0, (Math.pow(2,32-prefix) - 2)); }

      return {
        network: toOctets(network) + '/' + prefix,
        broadcast: toOctets(broadcast),
        first: toOctets(first),
        last: toOctets(last),
        usable: usable
      };
    }

    function render(result){
      document.getElementById('network').textContent = result.network;
      document.getElementById('broadcast').textContent = result.broadcast;
      document.getElementById('first').textContent = result.first;
      document.getElementById('last').textContent = result.last;
      document.getElementById('hosts').textContent = result.usable;
      out.style.display = 'block';
    }

    btn.addEventListener('click', ()=>{
      const val = elIp.value.trim();
      const res = calc(val);
      if(res) render(res);
    });

    // allow Enter in input
    elIp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') btn.click(); });
  </script>
</body>
</html>
